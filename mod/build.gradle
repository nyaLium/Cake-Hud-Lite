plugins {
    // 26.x 起 Minecraft 客户端不再发布混淆映射，Loom 的 "fabric-loom" 即 no-remap 模式
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Mod Menu 发布在 Modrinth 的 maven 上（Terraformers 的仓库在部分网络下不可达）
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // no-remap 模式下没有 modImplementation，直接用普通依赖配置
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu 是可选依赖：只在编译期提供 API，运行时没装也不影响；
    // runtimeOnly 只用于本地 runClient 验证设置界面，不会打进发布的 jar。
    compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    runtimeOnly "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'minecraft_version', project.minecraft_version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
               'loader_version': project.loader_version,
               'minecraft_version': project.minecraft_version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// 纯 JVM 自检：穷举所有配置选项组合，校验布局与配置归一化。
// 不启动游戏，可在 CI / 离线环境直接跑：gradlew selfCheck
tasks.register('selfCheck', JavaExec) {
    group = 'verification'
    description = '穷举每个配置选项的边界与组合，校验不产生非法几何'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.nyalium.ctthudfork.SelfCheck'
    // 输出里的中文在 Windows 控制台可能乱码，这里强制 UTF-8
    jvmArgs = ['-Dfile.encoding=UTF-8']
}

// 自检用的是普通 main()，没有 JUnit 用例；Gradle 9 默认会因为「有测试源码却零用例」报错。
tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}

// build/check 自动带上自检，避免改了选项忘了跑。
tasks.named('check') {
    dependsOn tasks.named('selfCheck')
}

